[project]
name = "mdnsbrowser"
version = "0.1.2"
description = "mDNS Browser for analysing the network"
authors = [{ name = "Thorsten Wagener", email = "thorsten.wagener@haw-hamburg.de" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "PyQt6>=6.7.1,<7.0.0",
    "PyQt6-Qt6>=6.7.2,<7.0.0",
    "zeroconf>=0.134.0,<0.135.0",
    "psutil>=7.0.0,<8.0.0",
    "async-upnp-client>=0.47.0,<0.48.0",
    "defusedxml>=0.7.1,<0.8.0",
]

[tool.poetry]
package-mode = true
packages = [{ include = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-qt = "^4.4.0"

[tool.poetry.group.build]
optional = true

[tool.poetry.group.build.dependencies]
pyinstaller = { version = "^6.14.2", python = ">=3.11,<3.16" }

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
qt_api = "pyqt6"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
